name: Quality Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check sw.js
      - name: Static app smoke checks
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s sw.js
          test -s manifest.webmanifest
          grep -q 'app.js' index.html
          grep -q 'styles.css' index.html
          grep -q 'manifest.webmanifest' index.html
          grep -q 'serviceWorker' app.js
